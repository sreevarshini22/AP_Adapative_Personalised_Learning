<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | AP Adaptive Personalised Learning Platform</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="/" style="display: flex; align-items: center; gap: 0.5rem; color: #fff;">
        <i class="fa-solid fa-graduation-cap" style="color: var(--primary-light);"></i>
        <span>AP Adaptive Personalised Learning</span>
      </a>
      <span class="badge-tag">Student</span>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
      <a href="/teacher-login" class="nav-link"><i class="fa-solid fa-chalkboard-user"></i> Faculty Portal</a>
      <a href="/ml-performance" class="nav-link"><i class="fa-solid fa-chart-line"></i> ML Benchmarks</a>
    </div>
  </nav>

  <div class="auth-page-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: var(--bg-surface); color: var(--primary-light); display: inline-flex; align-items: center; justify-content: center; font-size: 1.5rem; margin-bottom: 1rem; border: 1px solid var(--bg-card-border);">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <h2>Student Sign In</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Access your adaptive learning path & academic risk diagnosis</p>
      </div>

      <div id="errorMessage" style="display: none; background: var(--risk-high-bg); border: 1px solid var(--risk-high-border); color: #fca5a5; padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;">
      </div>

      <form id="studentLoginForm">
        <div class="form-group">
          <label class="form-label" for="email">Student Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. student@example.com" required value="student@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required value="student123" autocomplete="current-password">
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" onclick="togglePasswordVisibility('password', 'togglePasswordBtn')" aria-label="Show password" title="Show password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
        </button>
      </form>

      <div class="demo-credentials-box">
        <div style="display: flex; align-items: center; gap: 0.4rem; font-weight: 600; color: #a5b4fc;">
          <i class="fa-solid fa-key"></i> Quick Demo Account
        </div>
        <div style="margin-top: 0.4rem; color: var(--text-muted);">
          Click to auto-fill: 
          <span class="demo-pill" onclick="fillDemo('student@example.com', 'student123')">student@example.com / student123</span>
        </div>
      </div>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-dim);">
        Are you a faculty member? <a href="/teacher-login">Faculty Sign In &rarr;</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (!input || !btn) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      const icon = btn.querySelector('i');
      if (icon) {
        icon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      }
      const label = isPassword ? 'Hide password' : 'Show password';
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
    }

    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errBox = document.getElementById('errorMessage');
      const btn = document.getElementById('loginBtn');
      errBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const res = await fetch('/api/login/student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          window.location.href = '/student-dashboard';
        } else {
          errBox.textContent = data.error || 'Login failed. Please check credentials.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Server connection error. Please try again.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
